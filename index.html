<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><title>Shots desk</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1110;color:#9aa49e;font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{text-align:center;padding:24px}h1{font-size:20px;color:#e8ece9;margin:0 0 8px}</style></head>
<body><main><h1>Shots desk</h1><p id="msg">Opening…</p></main>
<script>
// This page holds no key and no readable data. snap.bin is locked; the key is the #k= part of the link you were sent
// (the part after # never leaves your browser). The machine that runs the model replaces snap.bin on a schedule.
async function unlock(buf, k) {
  const b = new Uint8Array(buf);
  if (String.fromCharCode(...b.slice(0, 4)) !== 'SHS1') throw new Error('not a snapshot');
  const raw = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('shots-desk-snap|' + k));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const zipped = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(4, 16)}, key, b.slice(16));
  return JSON.parse(await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('deflate'))).text());
}
(async () => {
  const msg = document.getElementById('msg');
  const k = new URLSearchParams(location.hash.slice(1)).get('k') || new URLSearchParams(location.search).get('k');
  if (!k) { msg.textContent = 'This page is private. Open it with the full link you were sent.'; return; }
  let buf;
  try { const r = await fetch('snap.bin?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) throw 0; buf = await r.arrayBuffer(); }
  catch (e) { msg.textContent = 'No copy has been published yet. Try again in a few minutes.'; return; }
  let snap;
  try { snap = await unlock(buf, k); } catch (e) { msg.textContent = 'This link could not open the page. Check that you have the full link.'; return; }
  const reload = '<scr' + 'ipt>setTimeout(() => location.reload(), 600000);</scr' + 'ipt>';
  document.open(); document.write(snap.html.replace('</body>', reload + '</body>')); document.close();
})();
</script></body></html>
